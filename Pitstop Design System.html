<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitstop Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Página de referencia: una columna con secciones ancladas. Los especímenes (.pit) se dibujan con los tokens reales y cambian de modo con el interruptor. */
:root {
  --bg: #f5f7f3; --surface: #ffffff; --fg: #17261e; --muted: #55665b; --line: #dce3d9;
  --accent: #006045; --accent-ink: #ffffff; --chip: #e8efe5; --warn-bg: #f7efdf; --warn-fg: #6d4f17;
  --good-bg: #e3f0e6; --good-fg: #1b5a3a;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1812; --surface: #15231b; --fg: #e5eee7; --muted: #9bb0a2; --line: #26392d;
    --accent: #55c493; --accent-ink: #06150d; --chip: #1c2f24; --warn-bg: #2b2412; --warn-fg: #e3c27a;
    --good-bg: #17301f; --good-fg: #9fdcb6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1812; --surface: #15231b; --fg: #e5eee7; --muted: #9bb0a2; --line: #26392d;
  --accent: #55c493; --accent-ink: #06150d; --chip: #1c2f24; --warn-bg: #2b2412; --warn-fg: #e3c27a;
  --good-bg: #17301f; --good-fg: #9fdcb6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; padding-bottom: 96px; }
p, h1, h2, h3, h4, dl, dd { margin: 0; }
h1, h2, h3, h4 { text-wrap: balance; letter-spacing: -0.02em; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin-inline: auto; padding-inline: 20px; }

/* Encabezado y navegación */
.top { padding-block: 56px 28px; display: grid; gap: 14px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; }
.top h1 span { color: var(--accent); }
.lede { max-width: 64ch; color: var(--muted); font-size: 16px; }
nav.sections { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.sections .row { max-width: 1040px; margin-inline: auto; padding-inline: 20px; display: flex; gap: 12px; align-items: center; }
nav.sections .links { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; flex: 1; min-width: 0; scrollbar-width: none; }
nav.sections a { white-space: nowrap; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px; }
nav.sections a:hover, nav.sections a:focus-visible { background: var(--chip); color: var(--fg); outline: none; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); flex: none; }
.mode button { font: 500 12px var(--font-ui); border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mode button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

section { padding-block: 64px 8px; scroll-margin-top: 56px; }
section > header { display: grid; gap: 8px; margin-bottom: 28px; max-width: 72ch; }
section > header h2 { font-size: 28px; font-weight: 600; }
section > header p { color: var(--muted); }
h3 { font-size: 17px; font-weight: 600; }
.group { margin-top: 40px; display: grid; gap: 14px; }
.group > .note, .note { color: var(--muted); font-size: 14px; max-width: 72ch; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--warn-fg); background: var(--warn-bg); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.tag.ok { color: var(--good-fg); background: var(--good-bg); }
.callout { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 14px 16px; font-size: 14px; max-width: 76ch; }
.callout.good { background: var(--good-bg); color: var(--good-fg); }

/* Tablas */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.grp td { background: var(--bg); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 8px; }
td.m { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
td.dim { color: var(--muted); }
td.was { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
td.now { color: var(--fg); }
.t-resumen { min-width: 720px; }
.t-al { min-width: 860px; }
.t-al td:first-child { font-weight: 600; white-space: nowrap; }

/* Swatches */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.sw { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: start; }
.chipbox { width: 84px; height: 56px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; display: flex; }
.chipbox span { flex: 1; display: block; }
.chipbox .l { background: #e2e8de; } .chipbox .d { background: #0e1612; }
.chipbox i { display: block; width: 100%; height: 100%; background: var(--c); }
.sw b { font-size: 13px; font-weight: 600; display: block; word-break: break-word; }
.sw .hex { display: grid; gap: 1px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
.sw .hex small { font-family: var(--font-ui); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.sw .use { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.sw .ct { font-size: 12px; margin-top: 6px; color: var(--good-fg); background: var(--good-bg); border-radius: 6px; padding: 3px 8px; display: inline-block; font-family: var(--font-mono); }
.absorbs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.absorbs small { font-size: 11px; color: var(--muted); margin-right: 2px; }
.dot { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding: 2px 6px 2px 4px; border: 1px solid var(--line); border-radius: 999px; }
.dot i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 1px solid rgba(0,0,0,.12); }

/* Forma y espacio */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.radii { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px; }
.radius { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.radius .box { height: 64px; background: #e2e8de; border: 1.5px solid #006045; }
.radius b { color: var(--fg); font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.sp { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sp i { display: block; height: 14px; background: #006045; border-radius: 3px; opacity: .85; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); background: var(--surface); }
.kv b { font-family: var(--font-mono); color: var(--fg); font-weight: 500; }
.shadows { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 24px; border-radius: 14px; }
.shadows.l { background: #e2e8de; color: #4b5d51; } .shadows.d { background: #0e1612; color: #9bb0a2; }
.shadows .card { height: 64px; border-radius: 16px; }
.shadows.l .card { background: #fff; } .shadows.d .card { background: #1c2a22; }
.shadows b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; display: block; margin-top: 10px; }
.shadows.l b { color: #20372d; } .shadows.d b { color: #e8f1ea; }
.shadows span { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.4; display: block; word-break: break-word; }
.type-sample { display: inline-block; color: #20372d; background: #e2e8de; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }

/* Layout grid */
.grid-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .grid-wrap { grid-template-columns: minmax(0, 1fr); } }
.phone-holder { position: relative; width: 100%; }
.phone { position: absolute; top: 0; left: 0; width: 393px; transform-origin: top left; border-radius: 28px; overflow: hidden; background: var(--surface-app); border: 1px solid var(--line); }
.phone .screen { position: relative; background: var(--surface-shell); min-height: 760px; display: flex; flex-direction: column; }
.grid-ov { position: absolute; inset: 0; display: none; grid-template-columns: repeat(4, 1fr); column-gap: 12px; padding-inline: 24px; pointer-events: none; z-index: 5; }
.grid-ov.on { display: grid; }
.grid-ov i { background: rgba(255, 45, 85, .13); }
.grid-ov::before, .grid-ov::after { content: ""; position: absolute; top: 0; bottom: 0; width: 24px; background: rgba(0, 120, 255, .14); }
.grid-ov::before { left: 0; } .grid-ov::after { right: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 12px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Estados */
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--bd); font: 500 11px/16px var(--font-ui); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.chip.solid { border-color: transparent; font-weight: 600; letter-spacing: .02em; gap: 4px; padding-inline: 8px; }
.chip.solid svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.fam { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.fam h4 { font-size: 13px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0; }
.fam .use { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.fam .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fam .cell { border-radius: 10px; padding: 10px; display: grid; gap: 8px; justify-items: start; }
.fam .cell.l { background: #ffffff; } .fam .cell.d { background: #0e1612; }
.fam .vals { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; }
.fam .cell.l .vals { color: #55665b; } .fam .cell.d .vals { color: #9bb0a2; }
td.cl { background: #ffffff; } td.cd { background: #0e1612; }
.t-fsm { min-width: 820px; }

/* Componentes */
.comp { margin-top: 56px; display: grid; gap: 16px; }
.comp-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.comp-head h3 { font-size: 20px; }
.comp-head .mono { color: var(--muted); font-size: 12px; }
.stage { border-radius: 14px; padding: 24px 20px; display: grid; gap: 16px; align-content: start; min-width: 0; overflow-x: auto; background: var(--surface-app); }
.stage > .in { width: 100%; max-width: 393px; margin-inline: auto; display: grid; gap: 16px; }
.stage.wide > .in { max-width: 560px; }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.box { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.box .hd { padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); border-radius: 12px 12px 0 0; }
.box .r { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.box .r:last-child { border-bottom: 0; }
.box dt { color: var(--muted); } .box dd { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; word-break: break-word; }
.box .r.txt dd { font-family: var(--font-ui); font-size: 13px; }
.box .p { padding: 12px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.box .p:last-child { border-bottom: 0; }
.part-name { font-size: 13px; font-weight: 600; margin: 14px 0 8px; }

/* Interruptor de propiedades (demo del botón) */
.demo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .demo { grid-template-columns: minmax(0, 1fr); } }
.props { display: grid; }
.props .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.props .row:last-child { border-bottom: 0; }
.props .row small { display: block; color: var(--muted); font-size: 11px; }
.props .val { font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.sw-t { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw-t[aria-checked="true"] { background: var(--accent); }
.sw-t[aria-checked="true"]::after { transform: translateX(16px); }
.sw-t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sw-t::after { transition: none; } }

/* Pasos */
.steps { counter-reset: step; display: grid; gap: 0; padding: 0; margin: 0; list-style: none; border-top: 1px solid var(--line); }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 14px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.steps > li::before { content: counter(step); font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 500; padding-top: 2px; }
.steps > li h3 { font-size: 15px; }
.steps > li p, .steps > li .sub { color: var(--muted); font-size: 14px; grid-column: 2; max-width: 80ch; }
.steps > li p b, .steps > li .sub b { color: var(--fg); font-weight: 600; }
.steps > li .sub { display: grid; gap: 6px; }
kbd { font-family: var(--font-mono); font-size: 11.5px; background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--fg); }

/* Código */
.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.tabs button { font: 500 13px var(--font-mono); border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.codebox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.codebox pre { margin: 0; padding: 18px; overflow: auto; max-height: 560px; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; color: var(--fg); tab-size: 2; }
.copy { position: absolute; top: 10px; right: 14px; font: 500 12px var(--font-ui); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.copy:hover, .copy:focus-visible { border-color: var(--accent); outline: none; }
.snippet { margin-top: 12px; }
.snippet pre { margin: 0; padding: 14px 16px; overflow: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); }
footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

/* ===== Especímenes (.pit): usan los tokens del design system ===== */
.pit { font-family: var(--font-ui); color: var(--text-strong); }
.pit *, .pit *::before, .pit *::after { box-sizing: border-box; }
.pit p, .pit h1, .pit h2, .pit h3, .pit div { margin: 0; }
.pit svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pit svg.s12 { width: 12px; height: 12px; } .pit svg.s16 { width: 16px; height: 16px; } .pit svg.s24 { width: 24px; height: 24px; } .pit svg.s32 { width: 32px; height: 32px; }
.p-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; min-width: 96px; padding: 0 20px; border-radius: 16px; border: 1px solid transparent; background: var(--brand-primary); color: var(--text-on-brand); box-shadow: var(--shadow-button); cursor: pointer; font-family: var(--font-ui); }
.p-btn.secondary { background: var(--surface-input); color: var(--brand-primary-text); border-color: var(--border-button); box-shadow: none; }
.p-btn.fab { box-shadow: var(--shadow-fab); }
.p-btn.icon { width: 48px; min-width: 0; height: 48px; padding: 0; background: transparent; color: var(--text-label); box-shadow: none; }
.p-btn.sq { width: 52px; min-width: 0; padding: 0; }
.p-btn.dis { opacity: .4; box-shadow: none; }
.p-btn.full { width: 100%; }
.p-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.p-field { display: grid; gap: 8px; width: 100%; }
.p-field .lab { color: var(--text-label); }
.p-field .lab em { font-style: normal; color: var(--text-muted); }
.p-ctl { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 16px; background: var(--surface-input); border: 1px solid var(--border-input); color: var(--text-placeholder); }
.p-ctl.filled { color: var(--text-strong); }
.p-ctl.focus { border: 2px solid var(--border-focus); padding: 0 15px; color: var(--text-strong); }
.p-ctl.err { border: 1.5px solid var(--status-danger-fg); padding: 0 15.5px; color: var(--text-strong); }
.p-ctl.area { height: auto; min-height: 104px; align-items: flex-start; padding: 16px; }
.p-ctl .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-ctl .tr { color: var(--text-muted); }
.p-help { color: var(--text-secondary); } .p-help.err { color: var(--status-danger-fg); }
.p-two { display: flex; gap: 12px; width: 100%; } .p-two > * { flex: 1; min-width: 0; }
.p-chk { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 12px 0; color: var(--text-label); }
.p-box { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--border-control); background: var(--surface-input); display: grid; place-items: center; color: #fff; flex: none; }
.p-box.on { background: var(--brand-primary); border-color: var(--brand-primary); }
.p-card { background: var(--surface-card); border: 1px solid var(--border-card); border-radius: 24px; box-shadow: var(--shadow-card); }
.p-slider-card { display: grid; gap: 12px; padding: 16px; }
.p-sl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.p-sl-head .l { display: flex; gap: 8px; align-items: center; color: var(--text-label); }
.p-sl-head .v { color: var(--brand-primary-text); }
.p-sl { position: relative; height: 24px; display: flex; align-items: center; }
.p-sl .tk { position: relative; width: 100%; height: 8px; border-radius: 999px; background: var(--progress-off); }
.p-sl .tk b { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 999px; background: var(--brand-primary); }
.p-sl .th { position: absolute; left: calc(50% - 12px); top: 0; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--brand-primary); box-shadow: var(--shadow-segmented); }
.p-sl-scale { display: flex; justify-content: space-between; color: var(--text-muted); }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 0; }
.p-stats > div { display: grid; justify-items: center; gap: 8px; border-left: 1px solid var(--border-divider); }
.p-stats > div:first-child { border-left: 0; }
.p-stats .n { color: var(--text-label); } .p-stats .c { color: var(--text-muted); }
.p-search { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 16px; background: color-mix(in srgb, var(--surface-input) 60%, transparent); border: 1px solid var(--border-card); color: var(--text-placeholder); }
.p-search svg { color: var(--text-muted); }
.p-seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-track); }
.p-seg > div { flex: 1; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-secondary); }
.p-seg > div.on { background: var(--brand-primary); color: var(--text-on-brand); box-shadow: var(--shadow-segmented); }
.p-count { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--surface-chip-count); color: var(--text-secondary); }
.p-sect { display: flex; justify-content: space-between; align-items: center; min-height: 48px; color: var(--text-muted); }
.p-sect .r { display: flex; align-items: center; gap: 8px; }
.p-order { padding: 16px; display: grid; gap: 12px; }
.p-order .meta { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); }
.p-order .meta .due { display: inline-flex; gap: 4px; align-items: center; }
.p-order .main { display: flex; gap: 12px; align-items: center; }
.p-tile { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-tile); color: var(--brand-primary-text); display: grid; place-items: center; flex: none; }
.p-tile.sm { width: 40px; height: 40px; }
.p-order .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
.p-order .sub { display: flex; gap: 8px; align-items: center; color: var(--text-secondary); }
.p-plate { background: var(--surface-chip-neutral); color: var(--text-secondary); border-radius: 6px; padding: 4px 8px; }
.p-order .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border-divider); }
.p-adv { display: flex; gap: 8px; align-items: center; color: var(--text-muted); }
.p-av { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-avatar); color: var(--text-avatar); display: grid; place-items: center; }
.p-av.md { width: 32px; height: 32px; border: 1px solid var(--border-card); }
.p-bars { display: flex; gap: 8px; }
.p-bars i { flex: 1; height: 4px; border-radius: 999px; background: var(--progress-off); }
.p-bars i.on { background: var(--progress-done); }
.p-empty { border: 1px dashed var(--border-dashed); border-radius: 24px; padding: 40px 24px; display: grid; justify-items: center; text-align: center; gap: 8px; }
.p-empty .ic { color: var(--text-muted); }
.p-empty .d { color: var(--text-secondary); max-width: 280px; }
.p-banner { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: var(--b-bg); color: var(--b-fg); border: 1px solid var(--b-bd); }
.p-banner.x { padding-right: 8px; }
.p-banner .tx { flex: 1; min-width: 0; display: grid; gap: 4px; }
.p-banner .act { display: inline-flex; align-items: center; height: 40px; }
.p-banner .cl { width: 40px; height: 40px; margin-block: -10px; display: grid; place-items: center; flex: none; }
.p-banner.float { box-shadow: var(--shadow-floating); }
.p-hdr { background: var(--surface-glass); border-bottom: 1px solid var(--border-glass); padding-bottom: 8px; }
.p-hdr .sb { height: 56px; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; color: var(--text-muted); font-size: 12px; }
.p-hdr .row { height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.p-logo { display: flex; align-items: center; gap: 8px; }
.p-logo .lt { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-primary); color: var(--text-on-brand); display: grid; place-items: center; }
.p-logo em { font-style: normal; color: var(--brand-primary-text); }
.p-actions { display: flex; gap: 4px; align-items: center; }
.p-actions .ib { width: 48px; height: 48px; display: grid; place-items: center; color: var(--text-label); position: relative; }
.p-actions .ib .nd { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-accent-amber); box-shadow: 0 0 0 2px var(--surface-shell); }
.p-nav { display: flex; padding: 8px 12px; background: var(--surface-nav); border-top: 1px solid var(--border-input); }
.p-nav > div { flex: 1; min-width: 0; height: 56px; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--text-muted); position: relative; border-radius: 12px; }
.p-nav > div.on { color: var(--brand-primary-text); }
.p-nav > div.on::after { content: ""; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--brand-primary-text); }
.p-sheet-scrim { background: var(--overlay-scrim); display: flex; flex-direction: column; justify-content: flex-end; border-radius: 12px; padding-top: 48px; }
.p-sheet { background: var(--surface-sheet); border-radius: 32px 32px 0 0; box-shadow: var(--shadow-sheet); padding-bottom: 24px; }
.p-sheet .grab { width: 36px; height: 4px; border-radius: 999px; background: var(--border-grabber); margin: 12px auto 0; }
.p-sheet .hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; min-height: 72px; }
.p-steps { display: flex; gap: 8px; padding-inline: 24px; margin-bottom: 16px; }
.p-steps i { flex: 1; height: 4px; border-radius: 999px; background: var(--progress-off); }
.p-steps i.on { background: var(--brand-primary); }
.p-list { margin-inline: 24px; overflow: hidden; }
.p-arow { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 16px; border-bottom: 1px solid var(--border-divider); }
.p-arow:last-child { border-bottom: 0; }
.p-arow .tx { flex: 1; display: grid; gap: 4px; min-width: 0; }
.p-arow .tx .s { color: var(--text-secondary); }
.p-arow .go { color: var(--text-muted); }
.p-guide { padding: 20px; display: grid; gap: 12px; }
.p-guide .d { color: var(--text-secondary); }
.p-hero { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 24px 24px 0; }
.p-hero .big { width: 80px; height: 80px; border-radius: 24px; background: var(--surface-tile); color: var(--brand-primary-text); display: grid; place-items: center; }
.p-hero .c { color: var(--text-secondary); } .p-hero .d { color: var(--text-secondary); max-width: 300px; }
.p-page { padding: 24px; display: grid; gap: 16px; flex: 1; align-content: start; }
.p-fab { position: absolute; right: 24px; bottom: 88px; z-index: 6; }
.p-eyebrow { color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
.p-eyebrow i { width: 4px; height: 4px; border-radius: 50%; background: var(--progress-done); }
.p-h1 em { font-style: normal; color: var(--brand-primary-text); }
.p-sub { color: var(--text-secondary); }

  },\n  fab: {\n    boxShadow: [\n      { offsetX: 0, offsetY: 7, blurRadius: 12.5, spreadDistance: 0, color: 'rgba(0,0,0,0.45)' },\n    ],\n    legacy: { shadowColor: 'rgb(0,0,0)', shadowOffset: { width: 0, height: 7 }, shadowOpacity: 0.45, shadowRadius: 6.25, elevation: 6 },\n  },\n  floating: {\n    boxShadow: [\n      { offsetX: 0, offsetY: 20, blurRadius: 14, spreadDistance: 0, color: 'rgba(0,0,0,0.35)' },\n      { offsetX: 0, offsetY: 8, blurRadius: 6, spreadDistance: 0, color: 'rgba(0,0,0,0.3)' },\n    ],\n    legacy: { shadowColor: 'rgb(0,0,0)', shadowOffset: { width: 0, height: 20 }, shadowOpacity: 0.35, shadowRadius: 7, elevation: 10 },\n  },\n  sheet: {\n    boxShadow: [\n      { offsetX: 0, offsetY: -8, blurRadius: 24, spreadDistance: 0, color: 'rgba(0,0,0,0.5)' },\n    ],\n    legacy: { shadowColor: 'rgb(0,0,0)', shadowOffset: { width: 0, height: -8 }, shadowOpacity: 0.5, shadowRadius: 12, elevation: 16 },\n  },\n};\n\n/* ---------- Layout grid ---------- */\nexport const layout = {\n  frame: { width: 393, height: 852 },\n  columns: 4,\n  margin: 24,\n  gutter: 12,\n  maxContentWidth: 460,\n  headerRow: 56,\n  headerPaddingBottom: 8,\n  bottomNavContent: 72,\n  fabGapAboveNav: 16,\n  rhythm: { section: 32, group: 24, field: 16, labelToField: 8, cardPadding: 16, cardPaddingLg: 20 },\n} as const;\n\n/** Ancho de una columna para un ancho de pantalla dado. */\nexport function columnWidth(screenWidth: number): number {\n  const content = Math.min(screenWidth, layout.maxContentWidth) - layout.margin * 2;\n  return (content - layout.gutter * (layout.columns - 1)) / layout.columns;\n}\n/** Ancho de un elemento que ocupa n columnas (incluye los gutters intermedios). */\nexport function span(n: number, screenWidth: number): number {\n  return columnWidth(screenWidth) * n + layout.gutter * (n - 1);\n}\n\n/* ---------- Theme ---------- */\nexport function getTheme(scheme: ColorScheme) {\n  return {\n    scheme,\n    colors: scheme === 'dark' ? darkColors : lightCo <script>

const allColors = DS.colorGroups.flatMap((g) => g.items);
const tok = (n) => allColors.find((x) => x.n === n);
const px = (n) => (n === 0 ? '0' : n + 'px');
const shadowCss = (layers) => layers.map((s) => `${px(s.x)} ${px(s.y)} ${px(s.blur)} ${px(s.spread)} ${s.color}`).join(', ');
const MODES = { l: 'Claro', d: 'Oscuro' };

/* color y contraste */
const parseC = (c) => {
  if (c[0] === '#') {
    let h = c.slice(1);
    if (h.length === 3) h = [...h].map((x) => x + x).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1];
  }
  const m = c.match(/rgba?\(([^)]+)\)/)[1].split(',').map(parseFloat);
  return [m[0], m[1], m[2], m[3] ?? 1];
};
const overC = (t, b) => [0, 1, 2].map((i) => t[i] * t[3] + b[i] * (1 - t[3])).concat(1);
const lumC = ([r, g, b]) => {
  const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
};
const crC = (a, b) => { const x = lumC(a), y = lumC(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const fmt = (n) => n.toFixed(1) + ':1';
function surfacesOf(mode) {
  const get = (n) => parseC(tok(n)[mode]);
  const app = get('surface/app');
  const base = (n) => (n === 'surface/app' ? app : overC(get(n), app));
  const out = {};
  for (const s of DS.contrast.surfaces) {
    const c = get(s.token);
    out[s.id] = c[3] < 1 ? overC(c, base(s.over || 'surface/app')) : c;
  }
  return out;
}
const SURF = { l: surfacesOf('l'), d: surfacesOf('d') };
function minContrast(hex, set, mode) {
  const c = parseC(hex);
  return Math.min(...DS.contrast.sets[set].map((id) => crC(c, SURF[mode][id])));
}
const NONTEXT = ['border/control', 'progress/done', 'border/focus'];
const vsCard = (hex, mode) => crC(parseC(hex), SURF[mode].card);

/* ===== variables CSS de los especímenes ===== */
function varsFor(mode) {
  let o = '';
  for (const it of allColors) o += `--${kebab(it.n)}:${it[mode]};`;
  for (const f of DS.status.order) {
    const v = DS.status.families[f][mode];
    o += `--status-${f}-bg:${v[0]};--status-${f}-fg:${v[1]};--status-${f}-border:${v[2]};`;
  }
  for (const [n, s] of Object.entries(DS.shadow)) o += `--shadow-${n}:${shadowCss(s[mode])};`;
  return o;
}
const typeCss = DS.type.styles
  .map((s) => `.t-${kebab(s.id)}{font:${s.weight} ${s.size}px/${s.line}px ${s.mono ? 'var(--font-mono)' : 'var(--font-ui)'};${s.ls ? `letter-spacing:${s.ls}px;` : ''}${s.upper ? 'text-transform:uppercase;' : ''}}`)
  .join('');
const dyn = document.createElement('style');
dyn.textContent = `.pit{${varsFor('l')}}\n:root[data-theme="dark"] .pit{${varsFor('d')}}\n${typeCss}`;
document.head.appendChild(dyn);

/* ===== especímenes ===== */
const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const T = (id) => 't-' + kebab(id);

const btn = ({ label = 'Registrar recepción', type = 'primary', lead, trail, dis, full, pressed } = {}) =>
  `<button class="p-btn ${type} ${dis ? 'dis' : ''} ${full ? 'full' : ''} ${T('button/md')}" ${dis ? 'disabled' : ''} ${pressed ? 'style="filter:brightness(.92)"' : ''} type="button">${lead ? ic(lead) : ''}<span>${label}</span>${trail ? ic(trail) : ''}</button>`;
const iconBtn = (n) => `<span class="p-btn icon">${ic(n)}</span>`;
const fabBtn = () => `<span class="p-btn fab ${T('button/md')}">${ic('plus')}<span>Nueva orden</span></span>`;

};

const statSummary = () => `<div class="p-card p-stats">

const segmented = () => `<div class="p-seg"><div class="on ${T('label/md')}">Todas<span class="p-count ${T('caption/medium')}" style="background:rgba(255,255,255,.2);color:var(--text-on-brand)">3</span></div><div class="${T('label/md')}">En taller<span class="p-count ${T('caption/medium')}">2</span></div><div class="${T('label/md')}">Listas<span class="p-count ${T('caption/medium')}">1</span></div></div>`;
const sectionTitle = () => `<div class="p-sect"><span class="${T('eyebrow')}">En el taller</span><span class="r"><span class="${T('caption')}">2 órdenes</span>${iconBtn('list')}</span></div>`;
const orderCard = ({ done = 3, fam = 'active', label = 'En Reparación', late = false, car = 'Nissan Versa', plate = 'PXM-482-B', client = 'Carlos Mendoza', folio = 'OT-1049', adv = 'Ana Ruiz' } = {}) => `<div class="p-card p-order">
  <div class="meta"><span class="${T('mono/id')}">${folio}</span><span class="due ${T('caption')}">${ic('clock', 's12')}Entrega 12 oct</span></div>
  <div class="main"><span class="p-tile">${ic('car', 's24')}</span><div class="info"><span class="${T('title/card')}">${car}</span><span class="sub"><span class="p-plate ${T('mono/plate')}">${plate}</span><span class="${T('caption')}">${client}</span></span></div>${ic('chev', 'go')}</div>
  <div class="foot"><span class="p-row" style="gap:8px">${badge(fam, label)}${late ? lateBadge() : ''}</span><span class="p-adv"><span class="p-av ${T('caption/medium')}">${adv[0]}</span><span class="${T('caption')}">${adv}</span></span></div>
  <div class="p-bars">${[0, 1, 2, 3, 4, 5].map((i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('')}</div></div>`;
const emptyState = () => `<div class="p-empty">${ic('doc', 's32')}<span class="${T('button/md')}">Sin órdenes todavía</span><span class="d ${T('body/md')}">Cuando registres una recepción, la orden aparece aquí.</span><div style="padding-top:12px">${btn({ label: 'Nueva recepción', type: 'secondary' })}</div></div>`;

const BI = { info: 'info', warning: 'warn', danger: 'alert', success: 'ok' };
const banner = ({ type, title, msg, action, dismiss, float }) => `<div class="p-banner ${dismiss ? 'x' : ''} ${float ? 'float' : ''}" role="${type === 'danger' ? 'alert' : 'status'}" style="--b-bg:var(--status-${type}-bg);--b-fg:var(--status-${type}-fg);--b-bd:var(--status-${type}-border)">${ic(BI[type])}<div class="tx">${title ? `<span class="${T('button/md')}">${title}</span>` : ''}<span class="${T('body/lg')}">${msg}</span></div>${action ? `<span class="act ${T('button/md')}">${action}</span>` : ''}${dismiss ? `<span class="cl">${ic('close')}</span>` : ''}</div>`;

const headerHome = () => `<div class="p-hdr"><div class="sb"><span>9:41</span><span>●●●</span></div><div class="row">
  <div class="p-logo"><span class="lt">${ic('wrench', 's24')}</span><span class="${T('display/wordmark')}">pitstop<em>.</em></span></div>
  <div class="p-actions"><span class="ib">${ic('search')}</span><span class="ib">${ic('bell')}<span class="nd"></span></span><span class="ib"><span class="p-av md ${T('caption/medium')}">M</span></span></div></div></div>`;
const headerDetail = () => `<div class="p-hdr"><div class="sb"><span>9:41</span><span>●●●</span></div><div class="row"><div class="p-actions">${iconBtn('back')}<span class="${T('label/lg')}" style="color:var(--text-secondary)">Nueva recepción</span></div></div></div>`;
const bottomNav = () => `<div class="p-nav">${[['list', 'Inicio', 1], ['wrench', 'Taller'], ['car', 'Clientes'], ['wallet', 'Cobros'], ['doc', 'Facturas']].map(([i, l, on]) => `<div class="${on ? 'on' : ''}">${ic(i, 's24')}<span class="${T('caption/medium')}">${l}</span></div>`).join('')}</div>`;

const actionRows = () => `<div class="p-card p-list">${[['wrench', 'Recepción', 'Cliente, placas y falla'], ['camera', 'Fotos del vehículo', 'Golpes y pertenencias'], ['shield', 'Firma del cliente', 'Aprobación de la cotización']].map(([i, l, s]) => `<div class="p-arow"><span class="p-tile sm">${ic(i)}</span><div class="tx"><span class="${T('label/md')}">${l}</span><span class="s ${T('caption')}">${s}</span></div>${ic('chev', 'go')}</div>`).join('')}</div>`;
const sheetOnboarding = () => `<div class="p-sheet-scrim"><div class="p-sheet"><div class="grab"></div>

  <div class="p-steps"><i class="on"></i><i></i><i></i></div>
  <div class="p-hero"><span class="big">${ic('wrench', 's32')}</span><span class="c ${T('caption')}">Paso 1 de 3</span><span class="${T('heading/lg')}">Recibe el vehículo</span><span class="d ${T('body/md')}">Toca Recepción. Captura cliente, placas y falla.</span></div>
  <div class="p-card p-guide" style="margin:24px 24px 0"><span class="p-tile sm">${ic('shield')}</span><span class="${T('button/md')}">Consejo</span><span class="d ${T('body/md')}">Toma fotos antes de entrar al taller.</span></div></div></div>`;
const sheetSearch = () => `<div class="p-sheet-scrim"><div class="p-sheet"><div class="grab"></div>

    ${statSummary()}${searchBar()}${segmented()}${sectionTitle()}${orderCard({ late: true })}${orderCard({ done: 5, fam: 'success', label: 'Lista p/ Entrega', car: 'Mazda 3', plate: 'RTL-190-C', client: 'Lucía Prado', folio: 'OT-1047' })}
  </div>
  <span class="p-fab">${fabBtn()}</span>${bottomNav()}${grid ? '<div class="grid-ov" id="gridov"><i></i><i></i><i></i><i></i></div>' : ''}</div></div>`;
/* ===== secciones ===== */
const sec = (id, eyebrow, title, lede, body) => `<section id="${id}"><div class="wrap"><header><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${lede ? `<p>${lede}</p>` : ''}</header>${body}</div></section>`;
const dotsOf = (arr, max = 4) => `<span class="absorbs" style="margin:0">${arr.slice(0, max).map((h) => `<span class="dot"><i style="--c:${h}"></i>${h}</span>`).join('')}${arr.length > max ? `<small>+${arr.length - max} más</small>` : ''}</span>`;
const sw2 = (it) => `<span class="dot" style="font-size:11px"><i style="--c:${it.l}"></i>${it.l}</span> <span class="dot" style="font-size:11px"><i style="--c:${it.d}"></i>${it.d}</span>`;

/* ---- Resumen ---- */
function resumen() {
  let rows = '';
  const grp = (t) => `<tr class="grp"><td colspan="4">${t}</td></tr>`;
  rows += grp('Color');
  for (const it of allColors) {
    if (!it.abs) continue;
    let was;
    if (it.check) {
      const worst = Math.min(...it.abs.map((h) => minContrast(h, it.check, 'l')));
      const now = minContrast(it.l, it.check, 'l');
      was = `${dotsOf(it.abs)} <span class="mono">peor ${fmt(worst)}</span>`;
      rows += `<tr><td class="m">${it.n}</td><td class="was">${was}</td><td class="now">${sw2(it)}<div class="mono dim">claro ${fmt(now)} · oscuro ${fmt(minContrast(it.d, it.check, 'd'))}</div></td><td class="dim">${it.abs.length} grises casi iguales y bajo 4.5:1 pasan a un solo valor.</td></tr>`;
    } else {
      const nt = NONTEXT.includes(it.n);
      const extra = nt ? `<div class="mono dim">vs tarjeta: claro ${fmt(vsCard(it.l, 'l'))} · oscuro ${fmt(vsCard(it.d, 'd'))}</div>` : '';
      const why = nt ? 'Los controles necesitan 3:1 contra la tarjeta. Antes no llegaban.' : 'Tonos casi idénticos unificados en un token.';
      rows += `<tr><td class="m">${it.n}</td><td class="was">${dotsOf(it.abs)}</td><td class="now">${sw2(it)}${extra}</td><td class="dim">${why}</td></tr>`;
    }
  }
  rows += grp('Tipografía');
  for (const s of DS.type.styles) {
    const sizes = [...s.was.matchAll(/(\d+(?:\.\d+)?)\//g)].map((m) => parseFloat(m[1]));
    const low = Math.min(...sizes) < 11;
    rows += `<tr><td class="m">${s.id}</td><td class="was">${s.was}</td><td class="now m">${s.size}/${s.line} · ${s.weight}${s.ls ? ' · ' + s.ls : ''}</td><td class="dim">${low ? '<span class="tag ok">subió a 11 px</span> ' : ''}${esc(s.use)}</td></tr>`;
  }

// Uso:

  return sec('boton', 'Paso a paso', 'Botón con icono final, como booleano',
    'En Figma, un booleano de componente muestra u oculta una capa. Aquí lo armas con iconos al inicio y al final, y los eliges con Instance swap.',
    `<div class="demo"><div class="box"><div class="hd">Properties · Button</div><div class="props" id="props"></div></div><div class="stage pit" style="min-height:200px;align-content:center"><div class="in" id="demobtn"></div></div></div>
    <div class="group"><ol class="steps">
      <li><h3>Dibuja el botón con auto layout</h3><p>Crea un frame (<kbd>F</kbd>) de 52 de alto y pulsa <kbd>Shift</kbd> + <kbd>A</kbd>. En el panel Auto layout: <b>Horizontal · Gap 8 · Padding H 20, V 0 · Alineación centro</b>. Tamaño: <b>Width Hug contents</b> y <b>Height Fixed 52</b>. Radio 16 y relleno brand/primary. Para el mínimo de 96, abre el menú de Width y elige Add min width.</p></li>
      <li><h3>Agrega las tres capas</h3><p>Dentro del frame pon un icono (instancia de tu componente Icon de 20 × 20), el texto del botón y otro icono. Nómbralas <b>Icon leading</b>, <b>Label</b> e <b>Icon trailing</b> con doble clic en el panel de capas. Arrástralas hasta que el canvas muestre icono, texto, icono.</p></li>
      <li><h3>Conviértelo en componente</h3><p>Con el frame seleccionado pulsa <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>K</kbd> (en Mac <kbd>⌘</kbd> + <kbd>⌥</kbd> + <kbd>K</kbd>). Llámalo <b>Button</b>.</p></li>
      <li><h3>Crea el booleano antes que las variantes</h3><p>Selecciona la capa <b>Icon trailing</b> en el panel de capas. En el panel derecho, sección <b>Layer</b>, junto al ojo hay un rombo con un <b>+</b> (Apply boolean property). Púlsalo, llama a la propiedad <b>Trailing icon</b> y deja el valor en true. Ahora aparece en <b>Properties</b> con un interruptor.</p><p class="sub">Hazlo ahora y no después: al duplicar una variante, las propiedades se copian ya enlazadas. Si creas el booleano al final, tendrás que enlazarlo a mano en cada variante.</p></li>
      <li><h3>Crea el Instance swap del icono</h3><p>Selecciona la instancia del icono. En la sección de la instancia, junto al nombre del componente, hay otro rombo (Apply instance swap property). Púlsalo y llámalo <b>Trailing icon type</b>. Luego abre el lápiz de la propiedad y en <b>Preferred values</b> elige tus iconos, para que el menú solo ofrezca esos.</p></li>
      <li><h3>Repite para el icono inicial</h3><p><b>Leading icon</b> (booleano) y <b>Leading icon type</b> (Instance swap). Los dos booleanos quedan en false por defecto, y en cada instancia enciendes el que necesites.</p></li>
      <li><h3>Ahora sí, crea las variantes</h3><p>Con el componente seleccionado, en <b>Properties</b> pulsa <b>+</b> y elige <b>Variant</b>. Crea <b>Type</b> (Primary, Secondary, FAB, Icon) y <b>State</b> (Default, Pressed, Disabled). Duplica la variante base y cambia solo el relleno, el borde y la sombra. Los booleanos ya vienen enlazados.</p></li>
      <li><h3>Prueba el booleano</h3><p>Arrastra una instancia a una pantalla y apaga <b>Trailing icon</b>. El icono desaparece y el botón se encoge, porque una capa oculta sale del auto layout y su gap también. Si el hueco se queda, revisa que la capa no tenga activado <b>Ignore auto layout</b>.</p></li>
      <li><h3>Ancho completo no es una propiedad</h3><p>Pon la instancia dentro de un frame con auto layout y, en Resizing, cambia el ancho a <b>Fill container</b>. El contenido se mantiene centrado. No uses un booleano para esto: un booleano no cambia el tamaño.</p></li>
      <li><h3>Variante Icon</h3><p>En <b>Type = Icon</b> deja solo un icono centrado de 48 × 48 y sin Label. Esas propiedades no aplican en esa variante.</p></li>
    </ol>
    <h3 style="margin-top:20px">Cómo queda en React Native</h3>
    <p class="note">El booleano se vuelve un prop opcional que recibe el icono. Si no lo pasas, no se dibuja ni deja hueco, igual que en Figma. Para el icono puedes usar @expo/vector-icons o lucide-react-native.</p>
    <div class="snippet"><pre>${esc(code)}</pre></div></div>`);

function renderDemo() {

  ${row('lead', 'Leading icon', 'Boolean')}${row('trail', 'Trailing icon', 'Boolean')}${row('type', 'Type = Secondary', 'Variant')}${row('dis', 'State = Disabled', 'Variant')}${row('fill', 'Resizing → Fill container', 'No es propiedad')}`;
  document.getElementById('demobtn').innerHTML = btn({ type: demo.type, lead: demo.lead && 'camera', trail: demo.trail && 'arrow', dis: demo.dis, full: demo.fill, label: 'Registrar recepción' }) + cap(demo.fill ? 'Ancho: Fill container' : 'Ancho: Hug contents');
  document.getElementById('props').querySelectorAll('.sw-t').forEach((b) => {

  });
}

/* teléfono: escala y cuadrícula */
function fitPhone() {
  const h = document.getElementById('phoneholder'), p = document.getElementById('phone');
  if (!h || !p) return;
  const s = Math.min(1, h.clientWidth / 393);
  p.style.transform = `scale(${s})`;
  h.style.height = p.offsetHeight * s + 'px';
}
addEventListener('resize', fitPhone);
fitPhone();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPhone);

const pre = document.getElementById('codepre');
const showTab = () => { pre.textContent = tab === 'ts' ? FILES.ts : FILES.css; document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab))); };
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; showTab(); }));
showTab();
document.getElementById('copybtn').addEventListener('click', async (e) => {
  const txt = tab === 'ts' ? FILES.ts : FILES.css;
  try { await navigator.clipboard.writeText(txt); } catch (_) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {}
    ta.remove();
  }
  e.target.textContent = 'Copiado';
  setTimeout(() => { e.target.textContent = 'Copiar'; }, 1500);
});
